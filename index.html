<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Place - File Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <h1>Digital Place</h1>
            </div>
            <button id="uploadBtn" class="btn primary-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Upload
            </button>
            <input type="file" id="fileInput" multiple style="display: none;">
        </header>

        <nav class="filter-tabs">
            <button class="tab active" data-filter="all">All Files</button>
            <button class="tab" data-filter="image">Photos</button>
            <button class="tab" data-filter="video">Videos</button>
            <button class="tab" data-filter="document">Docs</button>
        </nav>

        <main class="content">
            <div id="fileGrid" class="file-grid">
                <!-- Dynamic files will appear here -->
            </div>
            <div id="emptyState" class="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <p>No files uploaded yet. Tap Upload to add photos, videos, or documents.</p>
            </div>
        </main>
    </div>

    <!-- Media Viewer Modal -->
    <div id="viewerModal" class="modal">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">&times;</button>
            <div id="viewerContainer"></div>
            <div class="modal-footer">
                <span id="fileNameDisplay"></span>
                <button id="deleteFileBtn" class="btn danger-btn">Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
